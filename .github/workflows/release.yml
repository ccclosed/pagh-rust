name: release

# Tag-driven GitHub releases. New tags always carry the `v` prefix:
#
#   stable      vX.Y.Z       must be reachable from `main`  -> Release
#   pre-release vX.Y.Z-rc.N  must be reachable from `dev` AND not from `main`
#                            -> Pre-release (release-candidate lane only)
#
# Anything else (`-pre.N`, arbitrary suffixes) is refused. The base version
# `X.Y.Z` must equal the repository's version source (see `VERSION_FILE`): the
# tag is not allowed to disagree with what the crate reports. This repository
# publishes a source archive (plus `.sha256`); it builds no binary artifact
# here — the examples are built and size-checked in `ci.yml`.
#
# Old bare-numeric tags remain as history only: newly created tags must use the
# `v` prefix, and the workflow rejects bare-numeric (and any other non-`v`) tags
# on push. The `[0-9]*` trigger stays so such a push fails loudly instead of
# silently doing nothing.

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

env:
  # The workspace root Cargo.toml is a virtual manifest; the SDK version lives
  # in pagh_std/Cargo.toml (`[package].version`).
  VERSION_FILE: pagh_std/Cargo.toml

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag branch and version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main dev
          tag="${GITHUB_REF_NAME}"
          base="${tag#v}"
          base="${base%%-*}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::new tags must be vX.Y.Z or vX.Y.Z-rc.N (got $tag)"
            exit 1
          fi
          if [[ "$tag" =~ -rc\.[0-9]+$ ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/dev || {
              echo "::error::pre-release $tag must be reachable from dev"; exit 1; }
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::pre-release $tag must not point at a commit already on main"; exit 1
            fi
          else
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "::error::stable release $tag must be reachable from main"; exit 1; }
          fi
          if [ -f "$VERSION_FILE" ]; then
            version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' "$VERSION_FILE" | head -n1)"
          elif [ -f VERSION ]; then
            version="$(tr -d '[:space:]' < VERSION)"
          else
            echo "::error::no version source at $VERSION_FILE"; exit 1
          fi
          if [ -z "$version" ] || [ "$version" != "$base" ]; then
            echo "::error::tag base $base does not match version source $VERSION_FILE ($version)"; exit 1
          fi
          echo "tag=$tag version=$version" >> "$GITHUB_STEP_SUMMARY"

      - name: Create source archive and checksums
        shell: bash
        run: |
          set -euo pipefail
          name="$(basename "$GITHUB_REPOSITORY")-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar.gz --prefix="${GITHUB_REF_NAME}/" -o "$name" "$GITHUB_SHA"
          sha256sum "$name" > "$name.sha256"
          echo "ARCHIVE=$name" >> "$GITHUB_ENV"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generate_release_notes: true
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
