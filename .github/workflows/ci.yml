name: ci

# Three gates, one job:
#   * rustfmt for the whole workspace;
#   * the SDK and all examples built for riscv64gc-unknown-none-elf with the
#     pinned toolchain, the pagh linker script and rust-lld;
#   * host unit tests for the pure path/hash/LazyLock logic, which is the only
#     part of pagh_std that can be compiled for the host (libpagh contains
#     RISC-V `ecall` assembly).
#
# pagh-rust and pagh-api are checked out as siblings because the Cargo
# dependency and the linker script live in pagh-api. The toolchain is read from
# rust-toolchain.toml, so bumping the pin is one line.
#
# Neither cargo invocation passes `--locked`: `Cargo.lock` records the sibling
# `libpagh` version, which follows pagh-api's release cadence, so a hard lock
# would turn this repository red because another repository bumped a library.
# The vendored TLS crates are exact-pinned in pagh_std/Cargo.toml and resolved
# from `vendor/`, so the lock still fixes everything the SDK actually links.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: fmt, build, host tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pagh-rust
        uses: actions/checkout@v4
        with:
          path: pagh-rust

      - name: Checkout pagh-api (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/pagh-api
          ref: main
          path: pagh-api

      - name: Install the pinned toolchain (rust-toolchain.toml)
        working-directory: pagh-rust
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          echo "rust-toolchain.toml pins: $channel"
          rustup toolchain install "$channel" --profile minimal \
            --component rustfmt \
            --target riscv64gc-unknown-none-elf
          rustup run "$channel" rustc --version

      - name: Check formatting
        working-directory: pagh-rust
        # `cargo fmt --all` is documented to follow local path dependencies as
        # well, and pagh-api is a sibling checkout this repository must not
        # modify. Scope the gate to this workspace's three packages; their
        # examples are targets of those packages and are covered too.
        run: cargo fmt -p pagh_std -p pagh_hostcheck -p pagh_probes -- --check

      - name: Build the SDK, examples and diagnostic probes
        working-directory: pagh-rust
        run: ./build.sh --fixtures

      - name: Check the kernel 1 MiB image limit
        working-directory: pagh-rust
        # Every example that a default build produces, including 0.8.0's
        # kernel-backed `tls_get` (284 KiB debug — it links no TLS stack at all).
        run: |
          set -euo pipefail
          for elf in cat wc find threads_mutex spawn condvar io_traits tcp_server udp_echo \
                     sync_primitives hash_map dns socket_opts tls_get; do
            path="target/riscv64gc-unknown-none-elf/debug/examples/$elf"
            size=$(wc -c <"$path")
            echo "$path: $size bytes"
            test "$size" -le 1048576
          done

      - name: Build the vendored TLS path and check it against the 1 MiB limit (release)
        working-directory: pagh-rust
        # The 0.7.0 userland implementation is off by default and stays
        # release-only: `tls_get_vendored` links the vendored embedded-tls and
        # crypto backends, and its debug image is 1.16 MiB, over the kernel's
        # limit. Its live matrix (`tools/live_070.py`) runs release for the same
        # reason. `tls_get` is in the list too, so the two paths are sized in
        # one place.
        run: |
          set -euo pipefail
          ./build.sh --release --vendored
          for elf in tls_get tls_get_vendored hash_map dns socket_opts; do
            path="target/riscv64gc-unknown-none-elf/release/examples/$elf"
            size=$(wc -c <"$path")
            echo "$path: $size bytes"
            test "$size" -le 1048576
          done

      - name: Host tests for the pure path logic
        working-directory: pagh-rust
        # The host crate itself has no third-party dependencies, but the
        # workspace lockfile still names the sibling `libpagh`, so --locked
        # would fail for the same reason the build step does not use it.
        run: cargo test -p pagh_hostcheck --target x86_64-unknown-linux-gnu

      - name: Upload example ELFs
        uses: actions/upload-artifact@v4
        with:
          name: pagh-rust-examples
          path: |
            pagh-rust/target/riscv64gc-unknown-none-elf/debug/examples/cat
            pagh-rust/target/riscv64gc-unknown-none-elf/debug/examples/wc
            pagh-rust/target/riscv64gc-unknown-none-elf/debug/examples/find
            pagh-rust/target/riscv64gc-unknown-none-elf/debug/examples/threads_mutex
            pagh-rust/target/riscv64gc-unknown-none-elf/debug/examples/spawn
            pagh-rust/target/riscv64gc-unknown-none-elf/debug/examples/condvar
            pagh-rust/target/riscv64gc-unknown-none-elf/debug/examples/io_traits
            pagh-rust/target/riscv64gc-unknown-none-elf/debug/examples/tcp_server
            pagh-rust/target/riscv64gc-unknown-none-elf/debug/examples/udp_echo
            pagh-rust/target/riscv64gc-unknown-none-elf/debug/examples/sync_primitives
            pagh-rust/target/riscv64gc-unknown-none-elf/debug/examples/tls_get
            pagh-rust/target/riscv64gc-unknown-none-elf/release/examples/hash_map
            pagh-rust/target/riscv64gc-unknown-none-elf/release/examples/dns
            pagh-rust/target/riscv64gc-unknown-none-elf/release/examples/socket_opts
            pagh-rust/target/riscv64gc-unknown-none-elf/release/examples/tls_get_vendored
          if-no-files-found: error
          retention-days: 14
