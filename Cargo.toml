[workspace]
resolver = "2"
members = ["pagh_std", "hostcheck", "tools/probes"]
# `cargo build` / `cargo build --examples` mean "the SDK and its programs" by
# default; the host-only checker and the diagnostic probes are opt-in so a
# plain build does not try to compile a std crate for the bare-metal target.
default-members = ["pagh_std"]

# Userland is freestanding: no unwinder, one static ELF. `strip = "debuginfo"`
# matters: the kernel refuses images above 1 MiB, and debug info is not loaded
# by its ELF loader at all.
[profile.dev]
panic = "abort"
opt-level = 2
debug = false
strip = "debuginfo"
overflow-checks = true

[profile.release]
panic = "abort"
opt-level = 2
debug = false
strip = "debuginfo"
lto = false
codegen-units = 1