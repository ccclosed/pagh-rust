[package]
name = "pagh_std"
version = "0.9.0"
edition = "2021"
publish = false
description = "A std-like Rust layer over the pagh-riscv native ABI (libpagh)"
license = "MIT"

[lib]
name = "pagh_std"
path = "src/lib.rs"

[dependencies]
# The native userland runtime/syscall layer. This is a sibling checkout of
# `pagh-api`; see the workspace README for `PAGH_API` and the sibling layout.
libpagh = { path = "../../pagh-api/libpagh" }

# ─── TLS 1.3 ────────────────────────────────────────────────────────────
# The default `pagh_std::tls` needs NONE of this: since 0.8.0 the TLS 1.3
# handshake and its verification live in the kernel (syscalls 1100-1103), so the
# SDK only wraps `tls_connect`/`tls_read`/`tls_write`/`tls_close`. The crates
# below are the 0.7.0 userland implementation, kept behind the `vendored-tls`
# feature (module `pagh_std::tls::vendored`) and built only on request:
#
#     ./build.sh --vendored        # or: cargo build --features vendored-tls
#
# They are vendored, byte-pinned crates (see `vendor/` + `.gitattributes`): the
# same `embedded-tls` 0.19.0 the kernel links, carrying the same deliberate local
# patch (`src/connection.rs` refuses `Finished` unless `Certificate` and
# `CertificateVerify` preceded it — see the README's TLS section), plus the
# verify-only crypto backends the ported chain verifier dispatches on.
# `default-features = false` everywhere and `optional = true` so a default build
# compiles none of them: no std, no log, no tokio; `alloc` routes embedded-tls's
# record buffers through the SDK's heap.
embedded-tls = { version = "=0.19.0", default-features = false, features = ["alloc"], optional = true }
embedded-io = { version = "=0.7.1", default-features = false, optional = true }
embedded-io-async = { version = "=0.7.0", default-features = false, optional = true }
# The handshake RNG trait (`RngCore` + `CryptoRng`).
rand_chacha = { version = "=0.3.1", default-features = false, optional = true }
rand_core = { version = "=0.6.4", default-features = false, optional = true }
# Chain/signature verification backends (verify-only, no key generation):
# RSASSA-PKCS1-v1_5 (rsa), ECDSA P-384 (p384), Ed25519 (ed25519-dalek), the
# SHA-2 digests the X.509 layer hashes with, ECDSA P-256 and the `Verifier`
# trait shared by all of them.
rsa = { version = "=0.9.9", default-features = false, features = ["sha2"], optional = true }
p384 = { version = "=0.13.0", default-features = false, features = ["ecdsa", "sha384"], optional = true }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast"], optional = true }
sha2 = { version = "=0.10.9", default-features = false, features = ["oid"], optional = true }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa"], optional = true }
signature = { version = "=2.2.0", default-features = false, optional = true }
const-oid = { version = "=0.9.6", default-features = false, optional = true }

# The real programs live at the repository root (`examples/`) so the SDK and its
# examples read like one project, not like test fixtures hidden inside the crate;
# `tls_get_vendored` is the one that needs the `vendored-tls` feature above.

[features]
# Off by default: the kernel-backed TLS path must not drag a TLS stack, a CA
# bundle and five crypto backends into every program's image. See
# `pagh_std/src/tls/vendored/mod.rs` for what the feature buys and costs.
default = []
vendored-tls = [
    "dep:embedded-tls",
    "dep:embedded-io",
    "dep:embedded-io-async",
    "dep:rand_chacha",
    "dep:rand_core",
    "dep:rsa",
    "dep:p384",
    "dep:ed25519-dalek",
    "dep:sha2",
    "dep:p256",
    "dep:signature",
    "dep:const-oid",
]

[[example]]
name = "cat"
path = "../examples/cat.rs"

[[example]]
name = "wc"
path = "../examples/wc.rs"

[[example]]
name = "find"
path = "../examples/find.rs"
[[example]]
name = "threads_mutex"
path = "../examples/threads_mutex.rs"

[[example]]
name = "spawn"
path = "../examples/spawn.rs"

[[example]]
name = "condvar"
path = "../examples/condvar.rs"

[[example]]
name = "io_traits"
path = "../examples/io_traits.rs"

# 0.9.0: the userland I/O conveniences (`Cursor`, `Read::chain`, `Tee`). It is
# part of the default build: it links no TLS stack and no extra code, and the
# live matrix `tools/live_090.py` runs it in one boot.
[[example]]
name = "io_adapters"
path = "../examples/io_adapters.rs"

[[example]]
name = "tcp_server"
path = "../examples/tcp_server.rs"

[[example]]
name = "udp_echo"
path = "../examples/udp_echo.rs"

[[example]]
name = "sync_primitives"
path = "../examples/sync_primitives.rs"

[[example]]
name = "hash_map"
path = "../examples/hash_map.rs"

[[example]]
name = "dns"
path = "../examples/dns.rs"

[[example]]
name = "socket_opts"
path = "../examples/socket_opts.rs"

[[example]]
name = "tls_get"
path = "../examples/tls_get.rs"

[[example]]
name = "tls_get_vendored"
path = "../examples/tls_get_vendored.rs"
# The vendored example only exists when its implementation does: without the
# feature there is no `pagh_std::tls::vendored` to call.
required-features = ["vendored-tls"]
